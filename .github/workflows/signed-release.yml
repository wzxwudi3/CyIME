name: Signed Release APK

# 自用正式签名包：v1+v2 签名，装一次以后能一直覆盖升级、不丢词库。
# 构建提速：缓存 NDK / Gradle build cache / 原生依赖
# 每次出包更新 releases/tag/latest，固定下载链接：
# https://github.com/wzxwudi3/CyIME/releases/download/latest/CyIME-latest.apk
#
# 已排除的上游缺件任务（这些下载源 404，上游没传模型/日文库，与本仓库无关）：
#   prepareAzooKeyLibraries / prepareJapaneseDictionaries / prepareOfflineTranslateLibraries
on:
  workflow_dispatch:
    inputs:
      bundle_models:
        description: '打包内置模型（full 版，体积大很多）'
        type: boolean
        default: false
      run_tests:
        description: '跑单元测试（平时可关，省半分钟）'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Cache NDK
        id: ndk-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
          key: ndk-${{ runner.os }}-29.0.14206865

      - name: Install NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: sdkmanager "ndk;29.0.14206865"

      - name: Export NDK paths
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Cache Gradle build cache
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-bc-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            gradle-bc-${{ runner.os }}-

      - name: Cache native deps and CMake build
        uses: actions/cache@v6
        with:
          path: |
            app/src/main/jni/onnxruntime
            app/src/main/jniLibs/**/libonnxruntime.so
            app/.cxx
            app/src/main/jni/boost
            app/src/main/jni/boost-*.tar.xz
          key: native-${{ runner.os }}-${{ hashFiles('app/src/main/jni/CMakeLists.txt') }}
          restore-keys: |
            native-${{ runner.os }}-

      - name: Download native deps (ONNX Runtime)
        run: ./gradlew downloadOnnx --no-daemon --build-cache

      - name: Write keystore.properties
        env:
          KEY_BASE64: ${{ secrets.CYIME_KEY_BASE64 }}
          STORE_PASSWORD: ${{ secrets.CYIME_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CYIME_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CYIME_KEY_PASSWORD }}
        run: |
          printf 'keyBase64=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEY_BASE64" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > app/keystore.properties
          echo "keystore.properties 行数: $(wc -l < app/keystore.properties)"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        if: ${{ inputs.run_tests }}
        run: ./gradlew :app:testDebugUnitTest --no-daemon --build-cache -x prepareAzooKeyLibraries -x prepareJapaneseDictionaries -x prepareOfflineTranslateLibraries

      - name: Build signed release APKs
        run: ./gradlew assembleRelease --no-daemon --build-cache -x prepareAzooKeyLibraries -x prepareJapaneseDictionaries -x prepareOfflineTranslateLibraries ${{ inputs.bundle_models && '-PbundleModels=true' || '' }}

      - name: Verify signature (v1+v2)
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          for f in app/build/outputs/apk/release/*.apk; do
            echo "===== $f"
            "$APKSIGNER" verify --print-certs "$f" || exit 1
          done

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/CyIME-latest.apk
          ls -lh out/

      - name: Publish to rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 自签包（最新）
          body: "自签 arm64-v8a 版本，每次构建自动覆盖。"
          prerelease: true
          files: out/CyIME-latest.apk
          fail_on_unmatched_files: true

      - name: Upload signed APKs (artifact 备份)
        uses: actions/upload-artifact@v7
        with:
          name: signed-release-apks
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
