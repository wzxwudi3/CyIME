name: Signed Release APK

# 自用正式签名包：用你自己的 keystore 签 v1+v2，装一次以后能一直覆盖升级、不丢词库。
on:
  workflow_dispatch:
    inputs:
      bundle_models:
        description: '打包内置模型（full 版，体积大很多）'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install NDK
        run: |
          sdkmanager "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Cache native deps and CMake build
        uses: actions/cache@v6
        with:
          path: |
            app/src/main/jni/onnxruntime
            app/src/main/jniLibs/**/libonnxruntime.so
            app/.cxx
            app/src/main/jni/boost
            app/src/main/jni/boost-*.tar.xz
          key: native-${{ runner.os }}-${{ hashFiles('app/src/main/jni/CMakeLists.txt') }}
          restore-keys: |
            native-${{ runner.os }}-

      - name: Download native deps (ONNX Runtime)
        run: ./gradlew downloadOnnx --no-daemon

      # 从仓库 secrets 还原签名密钥：build.gradle.kts 支持 keystore.properties 里的 keyBase64
      - name: Write keystore.properties
        env:
          KEY_BASE64: ${{ secrets.CYIME_KEY_BASE64 }}
          STORE_PASSWORD: ${{ secrets.CYIME_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CYIME_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CYIME_KEY_PASSWORD }}
        run: |
          printf 'keyBase64=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEY_BASE64" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > app/keystore.properties
          echo "keystore.properties 行数: $(wc -l < app/keystore.properties)"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build signed release APKs
        run: ./gradlew assembleRelease --no-daemon ${{ inputs.bundle_models && '-PbundleModels=true' || '' }}

      - name: Verify signature (v1+v2)
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          for f in app/build/outputs/apk/release/*.apk; do
            echo "===== $f"
            "$APKSIGNER" verify --print-certs "$f" || exit 1
          done

      - name: Upload signed APKs
        uses: actions/upload-artifact@v7
        with:
          name: signed-release-apks
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
